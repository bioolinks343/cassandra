.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,8,28,0) 45%,rgba(223,170,242,.55) 78%,var(--bg) 100%)}
.who{position:absolute;left:0;right:0;bottom:22px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{margin:0;display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(44px,15vw,72px);line-height:1;letter-spacing:-.02em;text-shadow:0 2px 18px rgba(30,10,40,.35)}
.seal{width:.42em;height:.42em;flex:none;margin-top:.1em}
.pill{display:inline-flex;align-items:center;gap:9px;padding:8px 18px 8px 10px;border-radius:999px;background:var(--pill);color:var(--pill-ink);font-weight:700;font-size:20px;box-shadow:0 4px 16px rgba(80,30,110,.18)}
.dot{width:26px;height:26px;border-radius:50%;background:#5ccb6c;box-shadow:0 0 0 5px rgba(92,203,108,.28);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(92,203,108,.1)}}
.links{display:flex;flex-direction:column;gap:16px;padding:8px 16px 0}
.card{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:2/1;min-height:150px;border-radius:38px;border:4px solid rgba(110,110,115,.85);overflow:hidden;color:#fff;text-decoration:none;text-align:center;background:#3a2a40 var(--img) center/cover no-repeat;-webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.34),rgba(0,0,0,.08) 75%)}
